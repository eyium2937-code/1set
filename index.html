<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대국민 안내 서비스 포털</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 한국어 웹 폰트 (Pretendard) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }
        /* 부드러운 스크롤 */
        html { scroll-behavior: smooth; }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-blue-800 flex items-center gap-2">
                <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                대국민 안내 서비스
            </h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
        
        <!-- 1. 상단 카드뉴스 이미지 임베드 -->
        <section class="mb-12">
            <h2 class="text-xl font-bold text-gray-800 mb-6 border-b-2 border-blue-600 inline-block pb-1">주요 캠페인 안내</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- 이미지 1~4 -->
                <div class="overflow-hidden rounded-xl shadow-sm hover:shadow-md transition-shadow bg-white">
                    <img src="카드뉴스1.png" alt="카드뉴스 1" class="w-full h-auto aspect-square object-cover" onerror="this.src='https://placehold.co/400x400/e2e8f0/64748b?text=카드뉴스1'">
                </div>
                <div class="overflow-hidden rounded-xl shadow-sm hover:shadow-md transition-shadow bg-white">
                    <img src="카드뉴스2.png" alt="카드뉴스 2" class="w-full h-auto aspect-square object-cover" onerror="this.src='https://placehold.co/400x400/e2e8f0/64748b?text=카드뉴스2'">
                </div>
                <div class="overflow-hidden rounded-xl shadow-sm hover:shadow-md transition-shadow bg-white">
                    <img src="카드뉴스3.png" alt="카드뉴스 3" class="w-full h-auto aspect-square object-cover" onerror="this.src='https://placehold.co/400x400/e2e8f0/64748b?text=카드뉴스3'">
                </div>
                <div class="overflow-hidden rounded-xl shadow-sm hover:shadow-md transition-shadow bg-white">
                    <img src="카드뉴스4.png" alt="카드뉴스 4" class="w-full h-auto aspect-square object-cover" onerror="this.src='https://placehold.co/400x400/e2e8f0/64748b?text=카드뉴스4'">
                </div>
            </div>
        </section>

        <!-- 2. 안내서비스 데이터 및 검색 -->
        <section>
            <div class="mb-8 text-center max-w-2xl mx-auto">
                <h2 class="text-3xl font-extrabold text-gray-900 mb-4">어떤 서비스를 찾으시나요?</h2>
                
                <!-- 검색창 -->
                <div class="relative mt-6 shadow-sm rounded-full">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="searchInput" class="block w-full pl-12 pr-4 py-4 border border-gray-200 rounded-full leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-lg transition-colors" placeholder="카테고리 또는 문의기관을 검색해보세요 (예: 민원, 국토교통부)">
                </div>
                <!-- 결과 N건 표시 -->
                <div class="mt-4 text-sm font-medium text-blue-600 bg-blue-50 inline-block px-4 py-1.5 rounded-full" id="resultCountBadge">
                    결과를 불러오는 중...
                </div>
            </div>

            <!-- 카테고리별 카드 목록 그리드 -->
            <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- JavaScript로 카드가 동적 생성됩니다. -->
            </div>
            
            <!-- 검색 결과 없음 안내 -->
            <div id="noResult" class="hidden text-center py-16">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p class="text-lg text-gray-600">검색 결과가 없습니다.</p>
                <p class="text-sm text-gray-500 mt-1">다른 검색어를 입력해 보세요.</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-300 py-8 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 대국민 안내 서비스 포털. All rights reserved.</p>
            <p class="mt-2 text-gray-500">본 페이지는 안내용 샘플 페이지입니다.</p>
        </div>
    </footer>

    <!-- JavaScript 로직 -->
    <script>
        // 1. 제공된 데이터 하드코딩
        const rawData = [
            {"서비스명": "주민등록 발급 안내", "카테고리": "민원", "문의기관": "국토교통부"}, 
            {"서비스명": "전입신고 안내", "카테고리": "민원", "문의기관": "보건복지부"}, 
            {"서비스명": "인감증명 안내", "카테고리": "민원", "문의기관": "국토교통부"}, 
            {"서비스명": "민원접수 안내", "카테고리": "민원", "문의기관": "교육부"}, 
            {"서비스명": "정부24 이용 안내", "카테고리": "민원", "문의기관": "국토교통부"}, 
            {"서비스명": "기초연금 안내", "카테고리": "복지", "문의기관": "보건복지부"}, 
            {"서비스명": "복지급여 안내", "카테고리": "복지", "문의기관": "고용노동부"}, 
            {"서비스명": "장애인지원 안내", "카테고리": "복지", "문의기관": "보건복지부"}, 
            {"서비스명": "아동수당 안내", "카테고리": "복지", "문의기관": "지자체"}, 
            {"서비스명": "지방세 납부 안내", "카테고리": "세금", "문의기관": "보건복지부"}, 
            {"서비스명": "취득세 안내", "카테고리": "세금", "문의기관": "지자체"}, 
            {"서비스명": "재산세 안내", "카테고리": "세금", "문의기관": "지자체"}, 
            {"서비스명": "자동차등록 안내", "카테고리": "교통", "문의기관": "국토교통부"}, 
            {"서비스명": "운전면허 안내", "카테고리": "교통", "문의기관": "보건복지부"}, 
            {"서비스명": "주정차단속 안내", "카테고리": "교통", "문의기관": "국토교통부"}, 
            {"서비스명": "재난지원금 안내", "카테고리": "재난", "문의기관": "행정안전부"}, 
            {"서비스명": "대피소 안내", "카테고리": "재난", "문의기관": "국세청"}, 
            {"서비스명": "안전신고 안내", "카테고리": "재난", "문의기관": "국세청"}, 
            {"서비스명": "국민취업지원 안내", "카테고리": "일자리", "문의기관": "지자체"}, 
            {"서비스명": "구직급여 안내", "카테고리": "일자리", "문의기관": "국토교통부"}, 
            {"서비스명": "청년일자리 안내", "카테고리": "일자리", "문의기관": "지자체"}, 
            {"서비스명": "평생교육 안내", "카테고리": "교육", "문의기관": "지자체"}, 
            {"서비스명": "학자금 안내", "카테고리": "교육", "문의기관": "지자체"}, 
            {"서비스명": "교육비지원 안내", "카테고리": "교육", "문의기관": "행정안전부"}
        ];

        // 2. 카테고리별로 데이터 그룹화
        const processData = (data) => {
            const grouped = {};
            
            data.forEach(item => {
                if (!grouped[item.카테고리]) {
                    grouped[item.카테고리] = {
                        name: item.카테고리,
                        count: 0,
                        agencies: new Set() // 중복 제거를 위해 Set 사용
                    };
                }
                grouped[item.카테고리].count += 1;
                grouped[item.카테고리].agencies.add(item.문의기관);
            });

            // Set을 배열로 변환하고 문자열로 조인하여 최종 배열 생성
            return Object.values(grouped).map(cat => ({
                name: cat.name,
                count: cat.count,
                agenciesStr: Array.from(cat.agencies).join(', ')
            }));
        };

        const categoryCardsData = processData(rawData);

        // 3. DOM 요소 참조
        const searchInput = document.getElementById('searchInput');
        const cardsContainer = document.getElementById('cardsContainer');
        const resultCountBadge = document.getElementById('resultCountBadge');
        const noResult = document.getElementById('noResult');

        // 4. 카드 렌더링 함수
        const renderCards = (dataToRender) => {
            cardsContainer.innerHTML = ''; // 초기화
            
            if (dataToRender.length === 0) {
                cardsContainer.classList.add('hidden');
                noResult.classList.remove('hidden');
                resultCountBadge.textContent = '검색 결과가 없습니다 (0건)';
                return;
            }

            cardsContainer.classList.remove('hidden');
            noResult.classList.add('hidden');
            resultCountBadge.innerHTML = `총 <strong class="font-bold">${dataToRender.length}</strong>개의 서비스 분야`;

            dataToRender.forEach(cat => {
                // 카드 HTML 구조 생성
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 shadow-sm border border-gray-100 hover:shadow-lg hover:border-blue-200 transition-all duration-300 flex flex-col justify-between h-full relative overflow-hidden group";
                
                // 디자인 요소: 호버 시 상단 파란색 바 애니메이션
                const topBar = document.createElement('div');
                topBar.className = "absolute top-0 left-0 w-full h-1 bg-blue-500 transform origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-300";
                
                const contentHTML = `
                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-2xl font-bold text-gray-800">${cat.name}</h3>
                            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">
                                총 ${cat.count}건
                            </span>
                        </div>
                        <div class="mt-4">
                            <span class="inline-flex items-center text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
                                대표 문의기관
                            </span>
                            <p class="text-gray-600 font-medium leading-relaxed break-keep">
                                ${cat.agenciesStr}
                            </p>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-50">
                        <a href="#" class="text-sm text-blue-600 font-semibold hover:text-blue-800 flex items-center group-hover:underline">
                            서비스 자세히 보기 
                            <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </a>
                    </div>
                `;
                
                card.appendChild(topBar);
                card.innerHTML += contentHTML;
                cardsContainer.appendChild(card);
            });
        };

        // 5. 검색 및 필터링 기능
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            
            const filteredData = categoryCardsData.filter(cat => {
                const matchCategory = cat.name.toLowerCase().includes(keyword);
                const matchAgency = cat.agenciesStr.toLowerCase().includes(keyword);
                return matchCategory || matchAgency;
            });
            
            renderCards(filteredData);
        });

        // 6. 초기 렌더링 실행
        renderCards(categoryCardsData);

    </script>
</body>
</html>
